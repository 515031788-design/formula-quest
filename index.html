<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a0a12">
<title>Formula Quest — 数学复习冒险</title>
<style>
/* ============================================================
 * Formula Quest · 暗色游戏主题样式
 * ============================================================ */
:root{
  --bg-deep:#0a0a12; --bg-dark:#0f0e17; --bg-mid:#1a1a2e; --bg-card:#16213e;
  --bg-hover:#1f2944; --primary:#e94560; --primary-g:#ff6b8a; --accent:#00d9ff;
  --accent-g:#4de8ff; --gold:#ffd166; --green:#06d6a0; --green-g:#2ce8b8;
  --purple:#7b2cbf; --text:#f0f0f5; --text-dim:#8b8ba7; --text-muted:#5a5a78;
  --border:rgba(255,255,255,.08); --radius:14px; --radius-sm:8px;
  --shadow:0 4px 24px rgba(0,0,0,.4);
  --trans:.3s cubic-bezier(.4,0,.2,1); --trans-fast:.15s ease;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
html,body{width:100%;min-height:100%;overflow-x:hidden}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;
  background:var(--bg-deep);color:var(--text);line-height:1.5;
  min-height:100svh;overscroll-behavior:none;touch-action:manipulation;
  -webkit-user-select:none;user-select:none;
}
input,textarea{-webkit-user-select:text;user-select:text}
body::before{
  content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(ellipse at 20% 10%,rgba(123,44,191,.15),transparent 50%),
    radial-gradient(ellipse at 80% 80%,rgba(0,217,255,.08),transparent 50%),
    radial-gradient(ellipse at 50% 50%,rgba(233,69,96,.05),transparent 70%);
}
body::after{
  content:'';position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.4;
  background-image:
    radial-gradient(1px 1px at 25% 30%,rgba(255,255,255,.4),transparent),
    radial-gradient(1px 1px at 60% 70%,rgba(255,255,255,.3),transparent),
    radial-gradient(1px 1px at 85% 20%,rgba(255,255,255,.35),transparent),
    radial-gradient(1px 1px at 15% 80%,rgba(255,255,255,.25),transparent),
    radial-gradient(1px 1px at 45% 50%,rgba(255,255,255,.3),transparent),
    radial-gradient(2px 2px at 75% 45%,rgba(0,217,255,.2),transparent);
  background-size:100% 100%;
}
#app{position:relative;z-index:1;width:100%;max-width:600px;margin:0 auto;min-height:100svh;display:flex;flex-direction:column}

/* ---------- 通用 ---------- */
.page{display:none;flex:1;flex-direction:column;animation:fadeIn .4s ease}
.page.active{display:flex}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
@keyframes popIn{0%{opacity:0;transform:scale(.7)}60%{transform:scale(1.05)}100%{opacity:1;transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes glow{0%,100%{box-shadow:0 0 20px rgba(0,217,255,.3)}50%{box-shadow:0 0 40px rgba(0,217,255,.6)}}
@keyframes floatUp{0%{opacity:0;transform:translateY(0) scale(.8)}30%{opacity:1;transform:translateY(-20px) scale(1.1)}100%{opacity:0;transform:translateY(-80px) scale(.9)}}
@keyframes comboFlash{0%{transform:scale(1)}50%{transform:scale(1.3);text-shadow:0 0 20px var(--gold)}100%{transform:scale(1)}}
@keyframes hpPulse{0%{box-shadow:0 0 0 0 rgba(233,69,96,.6)}100%{box-shadow:0 0 0 12px rgba(233,69,96,0)}}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}

/* ---------- 顶部栏 ---------- */
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 16px;padding-top:max(14px,env(safe-area-inset-top));
  background:rgba(15,14,23,.85);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);position:sticky;top:0;z-index:50;
}
.topbar .logo{font-size:18px;font-weight:800;background:linear-gradient(135deg,var(--primary-g),var(--accent-g));-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:-.5px}
.topbar .rank-badge{font-size:11px;padding:4px 10px;border-radius:20px;font-weight:700;display:flex;align-items:center;gap:4px}
.topbar .back-btn{background:none;border:none;color:var(--accent);font-size:24px;cursor:pointer;padding:4px 8px;line-height:1}

/* ---------- 地图页 ---------- */
#map-page .map-header{text-align:center;padding:20px 16px 12px}
#map-page .map-header h1{font-size:26px;font-weight:800;letter-spacing:-.5px;background:linear-gradient(135deg,var(--primary-g),var(--gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
#map-page .map-header p{font-size:13px;color:var(--text-dim);margin-top:4px}
.stats-bar{display:flex;justify-content:center;gap:12px;padding:0 16px 16px;flex-wrap:wrap}
.stat-pill{background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:20px;padding:6px 14px;font-size:12px;display:flex;align-items:center;gap:5px;color:var(--text-dim)}
.stat-pill b{color:var(--text);font-weight:700}
.stat-pill .icon{font-size:14px}

.level-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:8px 16px 24px;flex:1}
.level-card{
  background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);
  padding:14px 8px;text-align:center;cursor:pointer;position:relative;
  transition:var(--trans);overflow:hidden;animation:slideUp .4s ease backwards;
}
.level-card:active{transform:scale(.95)}
.level-card.locked{opacity:.35;cursor:not-allowed}
.level-card.unlocked:hover{border-color:var(--accent);box-shadow:0 0 20px rgba(0,217,255,.15)}
.level-card.cleared{border-color:rgba(6,214,160,.3)}
.level-card .lc-icon{font-size:28px;margin-bottom:4px}
.level-card .lc-num{font-size:10px;color:var(--text-muted);font-weight:700}
.level-card .lc-name{font-size:12px;font-weight:600;margin-top:2px;line-height:1.3}
.level-card .lc-stars{font-size:11px;margin-top:6px;letter-spacing:1px}
.level-card .lc-lock{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:24px;background:rgba(10,10,18,.6)}
.level-card .lc-lock.hidden{display:none}
.star-filled{color:var(--gold);text-shadow:0 0 6px rgba(255,209,102,.5)}
.star-empty{color:var(--text-muted);opacity:.4}
.daily-btn{
  margin:0 16px 16px;padding:14px;border:2px dashed var(--purple);
  background:rgba(123,44,191,.1);border-radius:var(--radius);text-align:center;
  cursor:pointer;transition:var(--trans);font-weight:700;color:var(--text);
}
.daily-btn:active{transform:scale(.97)}
.daily-btn .db-icon{font-size:20px;margin-right:6px}

/* ---------- 战斗页通用 ---------- */
#battle-page{padding:0 16px;padding-bottom:max(24px,env(safe-area-inset-bottom))}
.battle-hud{display:flex;align-items:center;gap:10px;padding:12px 0;flex-wrap:wrap}
.hud-item{flex:1;min-width:80px}
.hud-label{font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:3px;font-weight:700}
.hud-bar{height:8px;background:rgba(255,255,255,.08);border-radius:4px;overflow:hidden;position:relative}
.hud-fill{height:100%;border-radius:4px;transition:width .5s cubic-bezier(.4,0,.2,1);position:relative}
.hud-fill.hp{background:linear-gradient(90deg,var(--primary),var(--primary-g))}
.hud-fill.boss{background:linear-gradient(90deg,var(--purple),var(--primary))}
.hud-fill.hp.low{animation:hpPulse 1s infinite}
.hud-value{font-size:13px;font-weight:700;margin-top:2px}
.hud-value.hp{color:var(--primary-g)}
.hud-value.boss{color:var(--primary-g)}

.combo-display{text-align:center;padding:4px 0 8px;min-height:32px}
.combo-display .combo-num{font-size:22px;font-weight:900;color:var(--gold);text-shadow:0 0 10px rgba(255,209,102,.4)}
.combo-display.has-combo .combo-num{animation:comboFlash .4s ease}
.combo-display .combo-label{font-size:11px;color:var(--gold);font-weight:700;letter-spacing:1px}
.combo-display.frenzy .combo-num{color:var(--primary-g);text-shadow:0 0 15px rgba(255,107,138,.6);animation:pulse .5s infinite}

.phase-banner{text-align:center;padding:8px 0 12px}
.phase-banner .pb-step{font-size:11px;color:var(--accent);letter-spacing:2px;font-weight:700;text-transform:uppercase}
.phase-banner .pb-title{font-size:18px;font-weight:800;margin-top:2px}
.phase-banner .pb-sub{font-size:12px;color:var(--text-dim);margin-top:2px}

/* ---------- 闪卡阶段 ---------- */
.flashcard-area{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:300px}
.flashcard{
  width:100%;max-width:380px;min-height:200px;
  background:linear-gradient(145deg,var(--bg-card),var(--bg-mid));
  border:2px solid var(--border);border-radius:20px;padding:28px 20px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;position:relative;transition:var(--trans);
}
.flashcard.flipped{border-color:var(--accent);box-shadow:0 0 30px rgba(0,217,255,.2)}
.flashcard .fc-en{font-size:16px;font-weight:700;color:var(--accent-g);margin-bottom:8px;line-height:1.4}
.flashcard .fc-cn{font-size:14px;color:var(--text-dim);margin-bottom:14px}
.flashcard .fc-answer{display:none;font-size:15px;color:var(--text);line-height:1.6}
.flashcard.flipped .fc-answer{display:block;animation:popIn .3s ease}
.flashcard.flipped .fc-prompt{display:none}
.flashcard .fc-formula{margin-top:10px;font-size:14px;color:var(--gold);font-weight:600;background:rgba(255,209,102,.08);padding:6px 12px;border-radius:8px}
.flashcard .fc-action{margin-top:8px;font-size:12px;color:var(--green-g)}
.flashcard .fc-tap-hint{position:absolute;bottom:10px;font-size:11px;color:var(--text-muted)}

.flash-options{width:100%;max-width:380px;margin-top:20px;display:grid;gap:10px}
.flash-opt{
  padding:14px;border-radius:12px;border:2px solid var(--border);
  background:var(--bg-card);font-size:14px;font-weight:600;color:var(--text);
  cursor:pointer;transition:var(--trans-fast);text-align:center;
}
.flash-opt:active{transform:scale(.97)}
.flash-opt.correct{border-color:var(--green);background:rgba(6,214,160,.15);color:var(--green-g)}
.flash-opt.wrong{border-color:var(--primary);background:rgba(233,69,96,.15);color:var(--primary-g);animation:shake .4s ease}

/* ---------- 挖空阶段 ---------- */
.fillblank-area{flex:1;display:flex;flex-direction:column;padding-top:8px}
.fb-question{font-size:18px;font-weight:700;text-align:center;padding:20px 12px;line-height:1.8;min-height:80px}
.fb-blank{
  display:inline-block;min-width:50px;padding:2px 8px;margin:0 2px;
  border:2px dashed var(--accent);border-radius:6px;text-align:center;
  color:var(--accent-g);font-weight:800;transition:var(--trans-fast);
}
.fb-blank.filled{border-style:solid;border-color:var(--green);color:var(--green-g);background:rgba(6,214,160,.1)}
.fb-blank.filled.wrong{border-color:var(--primary);color:var(--primary-g);background:rgba(233,69,96,.1);animation:shake .4s}
.fb-token-pool{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:16px 0;min-height:60px}
.fb-token{
  padding:10px 16px;border-radius:10px;font-weight:800;font-size:15px;
  background:linear-gradient(145deg,var(--bg-hover),var(--bg-card));
  border:1px solid var(--border);cursor:grab;transition:var(--trans-fast);
  touch-action:none;user-select:none;-webkit-user-select:none;
}
.fb-token:active{cursor:grabbing;transform:scale(1.1)}
.fb-token.used{opacity:.25;pointer-events:none}
.fb-token.dragging{opacity:.7;z-index:100;transform:scale(1.15);box-shadow:0 8px 24px rgba(0,0,0,.5)}
.fb-blank.drop-hover{border-color:var(--gold);background:rgba(255,209,102,.1);transform:scale(1.05)}
.fb-actions{display:flex;gap:10px;margin-top:12px}
.fb-btn{flex:1;padding:12px;border-radius:10px;border:none;font-weight:700;font-size:14px;cursor:pointer;transition:var(--trans-fast)}
.fb-btn:active{transform:scale(.97)}
.fb-btn.submit{background:linear-gradient(135deg,var(--green),var(--green-g));color:#0a0a12}
.fb-btn.skip{background:rgba(255,255,255,.08);color:var(--text-dim)}

/* ---------- BOSS阶段 ---------- */
.boss-area{flex:1;display:flex;flex-direction:column;padding-top:8px}
.boss-visual{text-align:center;padding:12px 0;position:relative}
.boss-avatar{font-size:56px;animation:pulse 2s infinite;display:inline-block}
.boss-avatar.hit{animation:shake .4s ease}
.boss-q{font-size:16px;font-weight:700;text-align:center;padding:12px;line-height:1.6;background:rgba(255,255,255,.04);border-radius:12px;margin:8px 0}
.boss-steps{display:flex;flex-direction:column;gap:8px;margin:12px 0}
.boss-step{
  display:flex;align-items:center;gap:8px;padding:10px 12px;
  background:var(--bg-card);border:1px solid var(--border);border-radius:10px;
  font-size:14px;animation:slideUp .3s ease backwards;
}
.boss-step .step-idx{width:22px;height:22px;border-radius:50%;background:var(--purple);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;flex-shrink:0}
.boss-step input{flex:1;background:none;border:none;color:var(--text);font-size:14px;font-weight:600;border-bottom:1px solid var(--border);padding:4px 0;outline:none}
.boss-step input:focus{border-bottom-color:var(--accent)}
.boss-step.done{border-color:var(--green)}
.boss-step.done .step-idx{background:var(--green)}
.boss-step.wrong{border-color:var(--primary);animation:shake .4s}
.boss-step .step-hint{font-size:11px;color:var(--text-muted);margin-left:auto;cursor:pointer;padding:2px 6px;border-radius:4px;background:rgba(255,255,255,.05)}
.boss-actions{display:flex;gap:10px;margin-top:8px}
.boss-btn{flex:1;padding:12px;border-radius:10px;border:none;font-weight:700;font-size:14px;cursor:pointer;transition:var(--trans-fast)}
.boss-btn:active{transform:scale(.97)}
.boss-btn.check{background:linear-gradient(135deg,var(--primary),var(--primary-g));color:#fff}
.boss-btn.hint{background:rgba(255,209,102,.15);color:var(--gold)}

/* ---------- 浮动反馈 ---------- */
.float-feedback{position:fixed;left:50%;top:40%;transform:translateX(-50%);z-index:200;pointer-events:none;font-size:28px;font-weight:900;animation:floatUp 1s ease forwards}
.float-feedback.pos{color:var(--green-g);text-shadow:0 0 15px rgba(6,214,160,.5)}
.float-feedback.neg{color:var(--primary-g);text-shadow:0 0 15px rgba(233,69,96,.5)}

/* ---------- Toast ---------- */
#toast-container{position:fixed;top:max(60px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:300;display:flex;flex-direction:column;gap:8px;pointer-events:none;width:90%;max-width:400px}
.toast{
  background:rgba(22,33,62,.95);backdrop-filter:blur(12px);border:1px solid var(--border);
  border-radius:12px;padding:12px 16px;font-size:13px;font-weight:600;text-align:center;
  animation:slideUp .3s ease;box-shadow:var(--shadow);
}
.toast.badge{border-color:var(--gold);background:rgba(255,209,102,.15);color:var(--gold)}
.toast.rank{border-color:var(--accent);background:rgba(0,217,255,.12);color:var(--accent-g)}
.toast.error{border-color:var(--primary);color:var(--primary-g)}

/* ---------- 结算页 ---------- */
#result-page{padding:24px 16px;text-align:center}
.result-icon{font-size:64px;animation:popIn .5s ease;margin-bottom:8px}
.result-title{font-size:28px;font-weight:900;background:linear-gradient(135deg,var(--gold),var(--primary-g));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:4px}
.result-sub{font-size:14px;color:var(--text-dim);margin-bottom:20px}
.result-stars{font-size:48px;margin:12px 0;letter-spacing:8px}
.result-stars .star-filled{display:inline-block;animation:popIn .5s ease backwards}
.result-stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:20px 0}
.result-stat{background:var(--bg-card);border:1px solid var(--border);border-radius:12px;padding:14px}
.result-stat .rs-label{font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:1px}
.result-stat .rs-value{font-size:20px;font-weight:800;margin-top:4px}
.result-actions{display:flex;flex-direction:column;gap:10px;margin-top:20px}
.btn-primary{padding:14px;border-radius:12px;border:none;font-weight:800;font-size:15px;cursor:pointer;background:linear-gradient(135deg,var(--primary),var(--primary-g));color:#fff;transition:var(--trans-fast)}
.btn-primary:active{transform:scale(.97)}
.btn-secondary{padding:14px;border-radius:12px;border:1px solid var(--border);font-weight:700;font-size:15px;cursor:pointer;background:rgba(255,255,255,.05);color:var(--text);transition:var(--trans-fast)}
.btn-secondary:active{transform:scale(.97)}

.ms-display{background:rgba(6,214,160,.08);border:1px solid rgba(6,214,160,.2);border-radius:12px;padding:14px;margin:16px 0;text-align:left}
.ms-display .ms-label{font-size:11px;color:var(--green);font-weight:700;letter-spacing:1px;margin-bottom:6px}
.ms-display .ms-text{font-size:13px;color:var(--text);line-height:1.6;font-style:italic}

/* ---------- 登录页 ---------- */
.login-wrap{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:40px 24px;text-align:center;
}
.login-logo{font-size:22px;font-weight:900;background:linear-gradient(135deg,var(--primary-g),var(--accent-g));-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:-.5px}
.login-title{font-size:30px;font-weight:900;margin-top:8px;background:linear-gradient(135deg,var(--primary-g),var(--gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.login-sub{font-size:13px;color:var(--text-dim);margin:10px 0 28px}
.login-name-input-wrap{display:flex;gap:10px;width:100%;max-width:340px}
.login-name-input{
  flex:1;padding:14px;border-radius:12px;border:2px solid var(--border);
  background:var(--bg-card);color:var(--text);font-size:16px;font-weight:600;outline:none;
  transition:var(--trans-fast);
}
.login-name-input:focus{border-color:var(--accent);box-shadow:0 0 15px rgba(0,217,255,.15)}
.login-enter{padding:14px 20px;white-space:nowrap;border-radius:12px}
.login-history-label{font-size:12px;color:var(--text-muted);margin:28px 0 10px;letter-spacing:1px;text-transform:uppercase}
.login-user-list{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;width:100%;max-width:360px}
.login-user-chip{
  padding:10px 16px;border-radius:20px;font-size:14px;font-weight:700;cursor:pointer;
  background:linear-gradient(145deg,var(--bg-hover),var(--bg-card));border:1px solid var(--border);
  transition:var(--trans-fast);
}
.login-user-chip:active{transform:scale(.95);border-color:var(--accent)}
.login-user-chip .chip-x{color:var(--primary-g);margin-left:6px;font-weight:900}
.login-tip{font-size:11px;color:var(--text-muted);margin-top:30px;max-width:300px;line-height:1.6}
.login-empty{font-size:13px;color:var(--text-muted);padding:12px;opacity:.7}

/* 切换用户确认框 */
.user-switch-overlay{
  position:fixed;inset:0;z-index:500;background:rgba(10,10,18,.85);backdrop-filter:blur(8px);
  display:flex;align-items:center;justify-content:center;padding:24px;
}
.user-switch-card{
  background:var(--bg-card);border:1px solid var(--border);border-radius:16px;padding:24px;
  width:100%;max-width:320px;box-shadow:var(--shadow);text-align:center;
}
.user-switch-card .usc-title{font-size:18px;font-weight:800;margin-bottom:6px}
.user-switch-card .usc-current{font-size:14px;color:var(--accent-g);margin-bottom:16px}
.user-switch-card .usc-list{display:flex;flex-direction:column;gap:8px;margin-bottom:16px;max-height:220px;overflow-y:auto}
.user-switch-card .usc-item{
  padding:12px;border-radius:10px;background:var(--bg-hover);border:1px solid var(--border);
  cursor:pointer;font-weight:600;transition:var(--trans-fast);text-align:left;
}
.user-switch-card .usc-item:active{transform:scale(.98)}
.user-switch-card .usc-item .usc-stars{float:right;font-size:12px;color:var(--gold)}
.user-switch-card .usc-new{padding:12px;border-radius:10px;border:2px dashed var(--accent);cursor:pointer;font-weight:700;color:var(--accent-g);margin-bottom:8px}

<script>
/* ============================================================
 * Formula Quest · 游戏引擎
 * ============================================================ */

// ---- 全局状态 ----
const USER_LIST_KEY = 'fq_user_list';
const ACTIVE_USER_KEY = 'fq_active_user';
let currentUser = null;      // 当前学生名
function storageKey(){ return 'fq_save_' + (currentUser || 'default'); }

const state = {
  current: null,      // 当前关卡数据
  chapter: 0,         // 当前关卡编号
  phase: 0,           // 0=闪卡 1=挖空 2=BOSS
  hp: 100,
  bossHP: 100,
  combo: 0,
  maxCombo: 0,
  phaseErrors: 0,     // 当前阶段错误数
  totalErrors: 0,
  frenzy: false,      // 公式狂暴
  flashIdx: 0,
  flashCorrect: 0,
  fbIdx: 0,
  bossIdx: 0,
  bossCorrect: 0,
  msEarned: false,
  isDaily: false,
  dailyQueue: [],
  // 存档
  save: { stars:{}, bestCombo:0, badges:[], revengeCards:[] }
};

// ---- 存档系统 ----
function loadSave(){
  try{
    const raw = localStorage.getItem(storageKey());
    if(raw) state.save = JSON.parse(raw);
  }catch(e){}
  if(!state.save.stars) state.save.stars={};
  if(!state.save.badges) state.save.badges=[];
  if(!state.save.revengeCards) state.save.revengeCards=[];
}
function persist(){
  try{ localStorage.setItem(storageKey(), JSON.stringify(state.save)); }catch(e){}
}

// ---- 段位计算 ----
function getRank(totalStars){
  if(totalStars>=48) return {name:'钻石',color:'#00d9ff',bg:'rgba(0,217,255,.15)'};
  if(totalStars>=30) return {name:'黄金',color:'#ffd166',bg:'rgba(255,209,102,.15)'};
  if(totalStars>=12) return {name:'白银',color:'#c0c0c0',bg:'rgba(192,192,192,.12)'};
  return {name:'青铜',color:'#c77dff',bg:'rgba(123,44,191,.2)'};
}

// ---- 关卡解锁 ----
function isUnlocked(ch){
  if(ch<=1) return true;
  // 前一关至少2星才能解锁
  return (state.save.stars[String(ch-1)]||0) >= 2;
}

// ---- 地图渲染 ----
function renderMap(){
  const grid = document.getElementById('level-grid');
  grid.innerHTML='';
  const totalStars = Object.values(state.save.stars).reduce((a,b)=>a+b,0);
  document.getElementById('total-stars').textContent = totalStars;
  document.getElementById('best-combo').textContent = state.save.bestCombo||0;
  document.getElementById('badge-count').textContent = state.save.badges.length;

  const rank = getRank(totalStars);
  const rb = document.getElementById('rank-badge');
  rb.textContent = rank.name;
  rb.style.background = rank.bg;
  rb.style.color = rank.color;

  // 更新顶栏用户按钮
  const ub = document.getElementById('user-btn');
  if(ub){
    ub.textContent = '👤 ' + (currentUser || '未登录');
  }

  QUEST_DATA.forEach((q,i)=>{
    const stars = state.save.stars[String(q.chapter)]||0;
    const unlocked = isUnlocked(q.chapter);
    const card = document.createElement('div');
    card.className = 'level-card '+(unlocked?'unlocked':'locked')+(stars>0?' cleared':'');
    card.style.animationDelay = (i*0.04)+'s';
    let starHTML='';
    for(let s=0;s<3;s++){
      starHTML += '<span class="'+(s<stars?'star-filled':'star-empty')+'">★</span>';
    }
    card.innerHTML = `
      <div class="lc-icon">${q.icon}</div>
      <div class="lc-num">第 ${q.chapter} 关</div>
      <div class="lc-name">${q.name}</div>
      <div class="lc-stars">${starHTML}</div>
      <div class="lc-lock ${unlocked?'hidden':''}">🔒</div>
    `;
    if(unlocked){
      card.addEventListener('click',()=>startBattle(q.chapter));
    }
    grid.appendChild(card);
  });
}

// ---- 开始战斗 ----
function startBattle(ch, isDaily=false){
  state.current = QUEST_DATA.find(q=>q.chapter===ch);
  if(!state.current) return;
  state.chapter = ch;
  state.isDaily = isDaily;
  state.phase = 0;
  state.hp = 100;
  state.combo = 0;
  state.maxCombo = 0;
  state.totalErrors = 0;
  state.frenzy = false;
  state.msEarned = false;
  state.flashIdx = 0;
  state.flashCorrect = 0;
  state.fbIdx = 0;
  state.bossIdx = 0;
  state.bossCorrect = 0;
  state.phaseErrors = 0;

  document.getElementById('map-page').classList.remove('active');
  document.getElementById('result-page').classList.remove('active');
  document.getElementById('battle-page').classList.add('active');
  document.getElementById('battle-title').textContent = state.current.icon+' '+state.current.name;
  document.getElementById('boss-hud-item').style.display='none';

  startPhase(0);
}

// ---- 阶段启动 ----
function startPhase(phase){
  state.phase = phase;
  state.phaseErrors = 0;
  const stepEl = document.getElementById('phase-step');
  const titleEl = document.getElementById('phase-title');
  const subEl = document.getElementById('phase-sub');

  if(phase===0){
    stepEl.textContent='PHASE 1 / 3';
    titleEl.textContent='闪卡突袭';
    subEl.textContent='看到英文触发词，选出对应的中文含义';
    renderFlashcard();
  }else if(phase===1){
    stepEl.textContent='PHASE 2 / 3';
    titleEl.textContent='挖空迷宫';
    subEl.textContent='拖拽下方词块填入空格，拼出完整公式';
    renderFillBlank();
  }else if(phase===2){
    stepEl.textContent='PHASE 3 / 3';
    titleEl.textContent='BOSS战';
    subEl.textContent='按步骤写出解题过程，击败BOSS！';
    state.bossHP = 100;
    document.getElementById('boss-hud-item').style.display='block';
    updateHUD();
    renderBossTask();
  }
}

// ---- HUD更新 ----
function updateHUD(){
  const hpFill = document.getElementById('hp-fill');
  const hpVal = document.getElementById('hp-value');
  hpFill.style.width = Math.max(0,state.hp)+'%';
  hpVal.textContent = Math.max(0,state.hp);
  if(state.hp<30) hpFill.classList.add('low'); else hpFill.classList.remove('low');

  const bossFill = document.getElementById('boss-fill');
  const bossVal = document.getElementById('boss-value');
  if(state.phase===2){
    bossFill.style.width = Math.max(0,state.bossHP)+'%';
    bossVal.textContent = Math.max(0,state.bossHP);
  }

  // 连击
  const cd = document.getElementById('combo-display');
  const cn = document.getElementById('combo-num');
  const cl = document.getElementById('combo-label');
  if(state.combo>0){
    cn.style.display='inline';
    cn.textContent = state.combo+'x';
    cd.classList.add('has-combo');
    if(state.combo>=5){
      cd.classList.add('frenzy');
      cl.textContent='公式狂暴！';
      state.frenzy = true;
    }else{
      cd.classList.remove('frenzy');
      cl.textContent='连击中';
      state.frenzy = false;
    }
  }else{
    cn.style.display='none';
    cd.classList.remove('has-combo','frenzy');
    cl.textContent='';
  }
}

// ---- 连击 ----
function bumpCombo(){
  state.combo++;
  if(state.combo>state.maxCombo) state.maxCombo=state.combo;
  if(state.combo>(state.save.bestCombo||0)){
    state.save.bestCombo = state.combo;
    persist();
  }
  updateHUD();
}
function breakCombo(){
  if(state.combo>=5) showFloat('连击中断！','neg');
  state.combo = 0;
  state.frenzy = false;
  updateHUD();
}

// ---- HP操作 ----
function damagePlayer(amount){
  state.hp = Math.max(0, state.hp - amount);
  updateHUD();
  if(state.hp<=0){
    setTimeout(()=>showResult(false), 600);
  }
}
function damageBoss(amount){
  state.bossHP = Math.max(0, state.bossHP - amount);
  const avatar = document.querySelector('.boss-avatar');
  if(avatar){avatar.classList.add('hit'); setTimeout(()=>avatar.classList.remove('hit'),400);}
  updateHUD();
  if(state.bossHP<=0){
    setTimeout(()=>showResult(true), 600);
  }
}

// ---- 浮动反馈 ----
function showFloat(text, type){
  const el = document.createElement('div');
  el.className = 'float-feedback '+(type||'pos');
  el.textContent = text;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(), 1000);
}

// ---- Toast ----
function showToast(text, type){
  const c = document.getElementById('toast-container');
  const el = document.createElement('div');
  el.className = 'toast '+(type||'');
  el.textContent = text;
  c.appendChild(el);
  setTimeout(()=>{el.style.opacity='0';el.style.transition='opacity .3s';setTimeout(()=>el.remove(),300);},2500);
}

/* ============================================================
 * 阶段1: 闪卡突袭
 * ============================================================ */
function renderFlashcard(){
  const content = document.getElementById('battle-content');
  const triggers = state.current.triggers;
  if(state.flashIdx >= triggers.length){
    // 闪卡阶段结束
    if(state.phaseErrors===0) showToast('闪卡全对！+10 HP','badge');
    state.hp = Math.min(100, state.hp+10);
    updateHUD();
    setTimeout(()=>startPhase(1), 600);
    return;
  }

  const t = triggers[state.flashIdx];
  // 生成4个选项
  const options = [t.cn];
  const others = triggers.filter(x=>x.cn!==t.cn).map(x=>x.cn);
  shuffle(others);
  while(options.length<4 && others.length>0) options.push(others.shift());
  if(options.length<4){
    // 从其他关补充选项
    const pool = [];
    QUEST_DATA.forEach(q=>q.triggers.forEach(x=>pool.push(x.cn)));
    shuffle(pool);
    pool.forEach(cn=>{ if(options.length<4 && !options.includes(cn)) options.push(cn); });
  }
  shuffle(options);

  content.innerHTML = `
    <div class="flashcard-area">
      <div class="flashcard" id="flashcard">
        <div class="fc-en" id="fc-en">${t.en}</div>
        <div class="fc-cn">选出对应的中文含义 ↓</div>
        <div class="fc-prompt" style="font-size:32px;color:var(--text-muted);margin:10px 0">❓</div>
        <div class="fc-answer" id="fc-answer">
          <div style="font-size:20px;font-weight:800;color:var(--green-g)">${t.cn}</div>
          <div class="fc-formula">${t.formula}</div>
          <div class="fc-action">→ ${t.action}</div>
        </div>
        <div class="fc-tap-hint">答对后点击卡片查看公式</div>
      </div>
      <div class="flash-options" id="flash-options">
        ${options.map(o=>`<div class="flash-opt" data-val="${escapeAttr(o)}">${o}</div>`).join('')}
      </div>
    </div>
  `;

  document.querySelectorAll('.flash-opt').forEach(el=>{
    el.addEventListener('click',()=>{
      if(el.classList.contains('correct')||el.classList.contains('wrong')) return;
      const val = el.getAttribute('data-val');
      if(val===t.cn){
        el.classList.add('correct');
        bumpCombo();
        state.flashCorrect++;
        showFloat('+10 ✔','pos');
        // 翻转卡片
        document.getElementById('flashcard').classList.add('flipped');
        setTimeout(()=>{
          state.flashIdx++;
          renderFlashcard();
        }, 1800);
      }else{
        el.classList.add('wrong');
        state.phaseErrors++;
        state.totalErrors++;
        breakCombo();
        damagePlayer(10);
        showFloat('-10 ✘','neg');
        // 加入复仇库
        addRevenge({wrong:`闪卡: ${t.en} → ${val}`, hint:`正确: ${t.cn} | ${t.formula}`});
        // 标出正确答案
        document.querySelectorAll('.flash-opt').forEach(o=>{
          if(o.getAttribute('data-val')===t.cn) o.classList.add('correct');
        });
        setTimeout(()=>{
          state.flashIdx++;
          renderFlashcard();
        }, 1500);
      }
    });
  });
}

/* ============================================================
 * 阶段2: 挖空迷宫（拖拽）
 * ============================================================ */
function renderFillBlank(){
  const content = document.getElementById('battle-content');
  const blanks = state.current.fillBlanks;
  if(state.fbIdx >= blanks.length){
    if(state.phaseErrors===0) showToast('挖空全对！+5 HP','badge');
    state.hp = Math.min(100, state.hp+5);
    updateHUD();
    setTimeout(()=>startPhase(2), 600);
    return;
  }

  const fb = blanks[state.fbIdx];
  // 生成token池：正确答案 + 干扰项
  const correctTokens = fb.answer.slice();
  const distractors = generateDistractors(fb.answer, state.current);
  const allTokens = correctTokens.concat(distractors);
  shuffle(allTokens);

  // 将题目中的 __ 替换为空位标记
  const parts = fb.q.split('__');
  let qHTML='';
  for(let i=0;i<parts.length;i++){
    qHTML += escapeHTML(parts[i]);
    if(i<fb.answer.length){
      qHTML += `<span class="fb-blank" data-blank="${i}" data-correct="${escapeAttr(fb.answer[i])}">___</span>`;
    }
  }

  content.innerHTML = `
    <div class="fillblank-area">
      <div class="fb-question">${qHTML}</div>
      <div class="fb-token-pool" id="token-pool">
        ${allTokens.map((t,i)=>`<div class="fb-token" data-val="${escapeAttr(t)}" data-idx="${i}">${escapeHTML(t)}</div>`).join('')}
      </div>
      <div class="fb-actions">
        <button class="fb-btn skip" id="fb-skip">跳过</button>
        <button class="fb-btn submit" id="fb-submit" disabled style="opacity:.5">提交</button>
      </div>
    </div>
  `;

  initDragDrop(fb);
  document.getElementById('fb-skip').addEventListener('click',()=>{
    state.phaseErrors++;
    state.totalErrors++;
    breakCombo();
    damagePlayer(8);
    showFloat('跳过 -8','neg');
    addRevenge({wrong:`挖空: ${fb.q}`, hint:`答案: ${fb.answer.join(', ')}`});
    state.fbIdx++;
    setTimeout(renderFillBlank, 600);
  });
}

function generateDistractors(correct, chapterData){
  // 从本关其他挖空题或trickCards中取干扰项
  const pool = new Set();
  chapterData.fillBlanks.forEach(fb=>fb.answer.forEach(a=>{if(!correct.includes(a))pool.add(a)}));
  chapterData.trapCards.forEach(tc=>{
    // 从错误答案提取干扰
    const m = tc.wrong.match(/=\s*(.+?)(?:[,，。])/);
    if(m) pool.add(m[1].trim());
  });
  // 补充通用干扰
  const extras = ['0','1','2','−1','x','y','a','b','c','n','k','d','r','2','3','4','5','1/2','∞','−∞','up','down','left','right'];
  extras.forEach(e=>pool.add(e));
  const arr = Array.from(pool).filter(x=>!correct.includes(x));
  shuffle(arr);
  // 干扰项数量 = 正确答案数量（保证池不太大）
  return arr.slice(0, Math.max(2, correct.length));
}

// ---- 拖拽逻辑（Touch + Mouse兼容）----
function initDragDrop(fb){
  const blanks = document.querySelectorAll('.fb-blank');
  const tokens = document.querySelectorAll('.fb-token');
  let activeToken = null;
  let activeClone = null;
  let touchOffset = {x:0,y:0};

  tokens.forEach(token=>{
    token.addEventListener('pointerdown', startDrag);
  });

  function startDrag(e){
    e.preventDefault();
    if(e.currentTarget.classList.contains('used')) return;
    activeToken = e.currentTarget;
    const rect = activeToken.getBoundingClientRect();
    touchOffset.x = e.clientX - rect.left;
    touchOffset.y = e.clientY - rect.top;

    // 创建拖拽克隆
    activeClone = activeToken.cloneNode(true);
    activeClone.classList.add('dragging');
    activeClone.style.position='fixed';
    activeClone.style.left=(e.clientX-touchOffset.x)+'px';
    activeClone.style.top=(e.clientY-touchOffset.y)+'px';
    activeClone.style.width=rect.width+'px';
    activeClone.style.zIndex='1000';
    activeClone.style.pointerEvents='none';
    document.body.appendChild(activeClone);

    activeToken.style.opacity='.3';

    document.addEventListener('pointermove', onMove);
    document.addEventListener('pointerup', endDrag);
  }

  function onMove(e){
    if(!activeClone) return;
    e.preventDefault();
    activeClone.style.left=(e.clientX-touchOffset.x)+'px';
    activeClone.style.top=(e.clientY-touchOffset.y)+'px';

    // 检测hover
    blanks.forEach(b=>{
      const r = b.getBoundingClientRect();
      if(e.clientX>=r.left && e.clientX<=r.right && e.clientY>=r.top && e.clientY<=r.bottom){
        b.classList.add('drop-hover');
      }else{
        b.classList.remove('drop-hover');
      }
    });
  }

  function endDrag(e){
    if(!activeClone) return;
    let dropped = false;
    blanks.forEach(b=>{
      const r = b.getBoundingClientRect();
      if(e.clientX>=r.left && e.clientX<=r.right && e.clientY>=r.top && e.clientY<=r.bottom){
        placeToken(b, activeToken);
        dropped = true;
      }
      b.classList.remove('drop-hover');
    });
    if(!dropped){
      activeToken.style.opacity='1';
    }
    activeClone.remove();
    activeClone=null;
    activeToken=null;
    document.removeEventListener('pointermove', onMove);
    document.removeEventListener('pointerup', endDrag);
  }

  function placeToken(blank, token){
    const val = token.getAttribute('data-val');
    // 如果空位已有token，先恢复
    const existing = blank.getAttribute('data-placed');
    if(existing){
      const oldToken = document.querySelector(`.fb-token[data-val="${CSS.escape(existing)}"]:not([style*="opacity: 1"])`);
      // 简化：直接恢复所有used中匹配的
      document.querySelectorAll('.fb-token.used').forEach(t=>{
        if(t.getAttribute('data-val')===existing && t.style.display!=='none'){
          t.classList.remove('used');
          t.style.opacity='1';
        }
      });
    }
    blank.textContent = val;
    blank.classList.add('filled');
    blank.setAttribute('data-placed', val);
    token.classList.add('used');
    token.style.opacity='.25';

    // 检查是否所有空位已填
    checkAllFilled();
  }

  // 也支持点击放置（备选）
  blanks.forEach(blank=>{
    blank.addEventListener('click',()=>{
      // 点击空位时，找一个未使用的token放上去
      const placed = blank.getAttribute('data-placed');
      if(placed){
        // 取消放置
        document.querySelectorAll('.fb-token').forEach(t=>{
          if(t.getAttribute('data-val')===placed && t.classList.contains('used')){
            t.classList.remove('used');
            t.style.opacity='1';
          }
        });
        blank.textContent='___';
        blank.classList.remove('filled','wrong');
        blank.removeAttribute('data-placed');
        document.getElementById('fb-submit').disabled=true;
        document.getElementById('fb-submit').style.opacity='.5';
      }
    });
  });
  // 点击token也能放置到下一个空位
  tokens.forEach(token=>{
    token.addEventListener('click',()=>{
      if(token.classList.contains('used')) return;
      const emptyBlank = Array.from(blanks).find(b=>!b.getAttribute('data-placed'));
      if(emptyBlank){
        placeToken(emptyBlank, token);
      }
    });
  });

  function checkAllFilled(){
    const allFilled = Array.from(blanks).every(b=>b.getAttribute('data-placed'));
    const submitBtn = document.getElementById('fb-submit');
    if(allFilled){
      submitBtn.disabled=false;
      submitBtn.style.opacity='1';
    }else{
      submitBtn.disabled=true;
      submitBtn.style.opacity='.5';
    }
  }

  document.getElementById('fb-submit').addEventListener('click',()=>{
    let allCorrect = true;
    blanks.forEach(b=>{
      const placed = b.getAttribute('data-placed');
      const correct = b.getAttribute('data-correct');
      if(placed===correct){
        b.classList.add('filled');
      }else{
        b.classList.add('wrong');
        allCorrect=false;
      }
    });

    if(allCorrect){
      bumpCombo();
      showFloat('+15 ✔','pos');
      state.fbIdx++;
      setTimeout(renderFillBlank, 1200);
    }else{
      state.phaseErrors++;
      state.totalErrors++;
      breakCombo();
      damagePlayer(12);
      showFloat('-12 ✘','neg');
      addRevenge({wrong:`挖空: ${fb.q}`, hint:`答案: ${fb.answer.join(', ')}`});
      // 显示正确答案
      blanks.forEach(b=>{
        b.textContent = b.getAttribute('data-correct');
        b.classList.remove('wrong');
        b.classList.add('filled');
      });
      state.fbIdx++;
      setTimeout(renderFillBlank, 1800);
    }
  });
}

/* ============================================================
 * 阶段3: BOSS战
 * ============================================================ */
function renderBossTask(){
  const content = document.getElementById('battle-content');
  const tasks = state.current.microTasks;
  if(state.bossIdx >= tasks.length || state.bossHP<=0){
    // BOSS战结束
    showResult(state.bossHP<=0);
    return;
  }

  const task = tasks[state.bossIdx];
  content.innerHTML = `
    <div class="boss-area">
      <div class="boss-visual">
        <div class="boss-avatar">${state.current.icon}</div>
      </div>
      <div class="boss-q">${escapeHTML(task.q)}</div>
      <div class="boss-steps" id="boss-steps">
        ${task.steps.map((s,i)=>`
          <div class="boss-step" data-idx="${i}">
            <div class="step-idx">${i+1}</div>
            <input type="text" placeholder="第${i+1}步..." data-correct="${escapeAttr(s)}" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
            <div class="step-hint" data-idx="${i}">💡</div>
          </div>
        `).join('')}
      </div>
      <div class="boss-actions">
        <button class="boss-btn hint" id="boss-hint-btn">查看提示</button>
        <button class="boss-btn check" id="boss-check">提交答案</button>
      </div>
    </div>
  `;

  // 提示按钮
  document.getElementById('boss-hint-btn').addEventListener('click',()=>{
    showToast('提示: '+task.ms, 'badge');
  });

  // 步骤提示
  document.querySelectorAll('.step-hint').forEach(el=>{
    el.addEventListener('click',()=>{
      const idx = parseInt(el.getAttribute('data-idx'));
      const correct = task.steps[idx];
      showToast('提示: '+correct, 'badge');
    });
  });

  // 提交
  document.getElementById('boss-check').addEventListener('click',()=>{
    let allCorrect = true;
    const inputs = document.querySelectorAll('.boss-step input');
    inputs.forEach((inp,i)=>{
      const val = inp.value.trim();
      const correct = task.steps[i];
      const stepEl = inp.closest('.boss-step');
      if(normalizeAnswer(val)===normalizeAnswer(correct)){
        stepEl.classList.add('done');
        inp.disabled=true;
      }else if(val===''){
        // 空值算错
        stepEl.classList.add('wrong');
        allCorrect=false;
      }else{
        stepEl.classList.add('wrong');
        allCorrect=false;
      }
    });

    if(allCorrect){
      bumpCombo();
      state.bossCorrect++;
      damageBoss(Math.ceil(100/tasks.length));
      showFloat('BOSS -'+Math.ceil(100/tasks.length)+'!','pos');
      // 满分句式
      if(!state.msEarned){
        state.msEarned = true;
        state.current.ms = task.ms;
      }
      state.bossIdx++;
      if(state.bossIdx<tasks.length && state.bossHP>0){
        setTimeout(renderBossTask, 1200);
      }
    }else{
      state.phaseErrors++;
      state.totalErrors++;
      breakCombo();
      damagePlayer(15);
      showFloat('-15 ✘','neg');
      addRevenge({wrong:`BOSS: ${task.q}`, hint:`步骤: ${task.steps.join(' → ')}`});
      // 显示正确答案
      inputs.forEach((inp,i)=>{
        const stepEl = inp.closest('.boss-step');
        if(stepEl.classList.contains('wrong')){
          inp.value = task.steps[i];
          stepEl.classList.remove('wrong');
          stepEl.classList.add('done');
          inp.disabled=true;
        }
      });
      state.bossIdx++;
      if(state.bossIdx<tasks.length && state.bossHP>0){
        setTimeout(renderBossTask, 2000);
      }
    }
  });

  // 第一个input聚焦
  setTimeout(()=>{
    const firstInput = document.querySelector('.boss-step input');
    if(firstInput) firstInput.focus();
  },300);
}

/* ============================================================
 * 结算
 * ============================================================ */
function showResult(victory){
  const isVictory = victory || state.bossHP<=0;
  const page = document.getElementById('result-page');
  document.getElementById('battle-page').classList.remove('active');
  page.classList.add('active');

  const icon = document.getElementById('result-icon');
  const title = document.getElementById('result-title');
  const sub = document.getElementById('result-sub');
  const starsEl = document.getElementById('result-stars');
  const statsEl = document.getElementById('result-stats');
  const msEl = document.getElementById('ms-display');
  const nextBtn = document.getElementById('result-next');

  if(!isVictory){
    icon.textContent='💀';
    title.textContent='挑战失败';
    title.style.background='linear-gradient(135deg,var(--primary),var(--primary-g))';
    title.style.webkitBackgroundClip='text';
    sub.textContent='HP耗尽了，再试一次吧！';
    starsEl.innerHTML='<span class="star-empty">★★★</span>';
    statsEl.innerHTML='';
    msEl.style.display='none';
    nextBtn.textContent='重新挑战';
    nextBtn.onclick = ()=>startBattle(state.chapter, state.isDaily);
    return;
  }

  // 胜利结算
  icon.textContent='🎉';
  title.textContent='关卡完成！';
  title.style.background='linear-gradient(135deg,var(--gold),var(--primary-g))';
  title.style.webkitBackgroundClip='text';

  // 星级评定
  let stars=1; // 基础1星
  const hpRatio = state.hp/100;
  if(hpRatio>=0.7) stars=2;
  if(hpRatio>=0.7 && state.maxCombo>=5) stars=3;

  // 更新存档
  const oldStars = state.save.stars[String(state.chapter)]||0;
  if(stars>oldStars){
    state.save.stars[String(state.chapter)] = stars;
  }
  persist();

  // 检查徽章
  if(state.totalErrors===0){
    const badge = state.current.badges[0];
    if(badge && !state.save.badges.includes(badge.name)){
      state.save.badges.push(badge.name);
      persist();
      setTimeout(()=>showToast('🏅 解锁徽章: '+badge.name,'badge'),800);
    }
  }

  // 段位检查
  const totalStars = Object.values(state.save.stars).reduce((a,b)=>a+b,0);
  const oldRank = getRank(oldStars>0?totalStars-stars:totalStars-stars);
  const newRank = getRank(totalStars);
  if(oldRank.name!==newRank.name){
    setTimeout(()=>showToast('🏆 段位升级: '+newRank.name+'！','rank'),1600);
  }

  let starHTML='';
  for(let i=0;i<3;i++){
    starHTML+=`<span class="${i<stars?'star-filled':'star-empty'}" style="animation-delay:${i*.15}s">★</span>`;
  }
  starsEl.innerHTML=starHTML;
  sub.textContent=`${state.current.icon} ${state.current.name}`;

  statsEl.innerHTML=`
    <div class="result-stat"><div class="rs-label">剩余HP</div><div class="rs-value" style="color:var(--green-g)">${state.hp}%</div></div>
    <div class="result-stat"><div class="rs-label">最高连击</div><div class="rs-value" style="color:var(--gold)">${state.maxCombo}x</div></div>
    <div class="result-stat"><div class="rs-label">总错误数</div><div class="rs-value" style="color:var(--primary-g)">${state.totalErrors}</div></div>
    <div class="result-stat"><div class="rs-label">获得星数</div><div class="rs-value" style="color:var(--accent-g)">${stars}★</div></div>
  `;

  // 满分句式
  if(state.current.ms){
    msEl.style.display='block';
    document.getElementById('ms-text').textContent = state.current.ms;
  }else{
    msEl.style.display='none';
  }

  // 下一关按钮
  if(state.isDaily){
    // 每日秘境模式
    const idx = state.dailyQueue.indexOf(state.chapter);
    if(idx>=0 && idx<state.dailyQueue.length-1){
      nextBtn.textContent='下一关 (秘境)';
      nextBtn.onclick = ()=>startBattle(state.dailyQueue[idx+1], true);
    }else{
      nextBtn.textContent='秘境完成！返回地图';
      nextBtn.onclick = ()=>goMap();
    }
  }else{
    if(state.chapter<18 && isUnlocked(state.chapter+1)){
      nextBtn.textContent='下一关 →';
      nextBtn.onclick = ()=>startBattle(state.chapter+1);
    }else{
      nextBtn.textContent='返回地图';
      nextBtn.onclick = ()=>goMap();
    }
  }
}

/* ============================================================
 * 复仇库
 * ============================================================ */
function addRevenge(card){
  // 去重
  if(state.save.revengeCards.some(c=>c.wrong===card.wrong)) return;
  state.save.revengeCards.push(card);
  if(state.save.revengeCards.length>50) state.save.revengeCards.shift();
  persist();
}

/* ============================================================
 * 每日秘境
 * ============================================================ */
function startDaily(){
  const pool = QUEST_DATA.filter(q=>isUnlocked(q.chapter));
  if(pool.length<3){
    showToast('至少解锁3关才能挑战秘境','error');
    return;
  }
  shuffle(pool);
  state.dailyQueue = pool.slice(0,3).map(q=>q.chapter);
  showToast('🎲 秘境开启: 第'+state.dailyQueue.join('→')+'关','rank');
  setTimeout(()=>startBattle(state.dailyQueue[0], true), 1000);
}

/* ============================================================
 * 工具函数
 * ============================================================ */
function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
  return arr;
}
function escapeHTML(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function escapeAttr(s){return String(s).replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
function normalizeAnswer(s){
  return String(s).trim().toLowerCase()
    .replace(/\s+/g,'')
    .replace(/×/g,'*')
    .replace(/÷/g,'/')
    .replace(/−/g,'-')
    .replace(/–/g,'-');
}

function goMap(){
  document.getElementById('battle-page').classList.remove('active');
  document.getElementById('result-page').classList.remove('active');
  document.getElementById('map-page').classList.add('active');
  renderMap();
}

/* ============================================================
 * 事件绑定
 * ============================================================ */
document.getElementById('battle-back').addEventListener('click',()=>{
  if(confirm('退出本关？进度不会保存。')) goMap();
});
document.getElementById('result-replay').addEventListener('click',()=>{
  startBattle(state.chapter, state.isDaily);
});
document.getElementById('result-map').addEventListener('click', goMap);
document.getElementById('daily-btn').addEventListener('click', startDaily);
document.getElementById('reset-btn').addEventListener('click',()=>{
  if(currentUser && confirm(`确定重置 ${currentUser} 的存档？所有星数、徽章、复仇卡都会清除！`)){
    localStorage.removeItem(storageKey());
    state.save = {stars:{},bestCombo:0,badges:[],revengeCards:[]};
    renderMap();
    showToast('存档已重置','error');
  }
});

// ---- 键盘支持 ----
document.addEventListener('keydown',(e)=>{
  if(e.key==='Escape'){
    if(document.getElementById('battle-page').classList.contains('active')) goMap();
  }
  if(e.key==='Enter'){
    // 登录页Enter登录
    const loginPage = document.getElementById('login-page');
    if(loginPage.classList.contains('active')){
      loginByName();
      return;
    }
    // BOSS战中Enter提交
    const checkBtn = document.getElementById('boss-check');
    if(checkBtn && !checkBtn.disabled) checkBtn.click();
  }
});

/* ============================================================
 * 学生登录系统
 * ============================================================ */
function getUserList(){
  try{ return JSON.parse(localStorage.getItem(USER_LIST_KEY))||[]; }catch(e){ return []; }
}
function saveUserList(list){
  try{ localStorage.setItem(USER_LIST_KEY, JSON.stringify(list)); }catch(e){}
}
function addToUserList(name){
  let list = getUserList();
  if(!list.includes(name)){ list.unshift(name); saveUserList(list); }
}

function renderLogin(){
  const list = getUserList();
  const container = document.getElementById('login-user-list');
  if(list.length===0){
    container.innerHTML = '<div class="login-empty">还没有同学，输入名字开始吧</div>';
  }else{
    container.innerHTML = list.map(name=>`
      <div class="login-user-chip" data-user="${escapeAttr(name)}">
        ${escapeHTML(name)}
        <span class="chip-x" data-del="${escapeAttr(name)}">✕</span>
      </div>
    `).join('');
    container.querySelectorAll('.login-user-chip').forEach(chip=>{
      chip.addEventListener('click',(e)=>{
        if(e.target.classList.contains('chip-x')){
          e.stopPropagation();
          // 删除用户
          let list2 = getUserList().filter(n=>n!==e.target.getAttribute('data-del'));
          saveUserList(list2);
          renderLogin();
          return;
        }
        loginByName(chip.getAttribute('data-user'));
      });
    });
  }
  // 清空输入框
  document.getElementById('login-name-input').value='';
  document.getElementById('login-name-input').focus();
}

function loginByName(name){
  name = (name || document.getElementById('login-name-input').value || '').trim();
  if(!name){
    showToast('请输入名字','error');
    return;
  }
  // 简单防注入：去掉可能破坏存储的字符
  name = name.replace(/[\\'"]/g,'').slice(0,12);
  if(!name){ showToast('名字无效，请重新输入','error'); return; }

  currentUser = name;
  try{ localStorage.setItem(ACTIVE_USER_KEY, currentUser); }catch(e){}
  addToUserList(currentUser);

  // 加载该学生存档
  state.save = { stars:{}, bestCombo:0, badges:[], revengeCards:[] };
  loadSave();
  persist();   // 立即落盘，确保每个学生都有独立存档
  renderMap();

  // 切到地图页
  document.getElementById('login-page').classList.remove('active');
  document.getElementById('map-page').classList.add('active');
  showToast(`👋 欢迎回来，${currentUser}！`, 'rank');
}

function switchUser(){
  const overlay = document.createElement('div');
  overlay.className = 'user-switch-overlay';
  const list = getUserList();
  overlay.innerHTML = `
    <div class="user-switch-card">
      <div class="usc-title">切换同学</div>
      <div class="usc-current">当前：${escapeHTML(currentUser||'未登录')}</div>
      <div class="usc-list">
        ${list.map(name=>{
          const s = (function(){
            try{ const d=JSON.parse(localStorage.getItem('fq_save_'+name)||'{}'); 
              return Object.values(d.stars||{}).reduce((a,b)=>a+b,0);}catch(e){return 0;}
          })();
          return `<div class="usc-item" data-user="${escapeAttr(name)}">${escapeHTML(name)}<span class="usc-stars">⭐${s}</span></div>`;
        }).join('')}
      </div>
      <div class="usc-new">＋ 添加新同学</div>
      <div class="usc-close">关闭</div>
    </div>
  `;
  document.body.appendChild(overlay);

  overlay.querySelectorAll('.usc-item').forEach(item=>{
    item.addEventListener('click',()=>{
      loginByName(item.getAttribute('data-user'));
      overlay.remove();
    });
  });
  overlay.querySelector('.usc-new').addEventListener('click',()=>{
    overlay.remove();
    document.getElementById('map-page').classList.remove('active');
    document.getElementById('login-page').classList.add('active');
    renderLogin();
  });
  overlay.querySelector('.usc-close').addEventListener('click',()=>overlay.remove());
  overlay.addEventListener('click',(e)=>{ if(e.target===overlay) overlay.remove(); });
}

function goLogin(){
  currentUser = null;
  try{ localStorage.removeItem(ACTIVE_USER_KEY); }catch(e){}
  document.getElementById('map-page').classList.remove('active');
  document.getElementById('battle-page').classList.remove('active');
  document.getElementById('result-page').classList.remove('active');
  document.getElementById('login-page').classList.add('active');
  renderLogin();
}

// ---- 登录页事件 ----
document.getElementById('login-enter-btn').addEventListener('click', ()=>loginByName());
document.getElementById('login-name-input').addEventListener('keydown',(e)=>{
  if(e.key==='Enter'){ e.preventDefault(); loginByName(); }
});

// ---- 顶栏用户按钮 ----
document.getElementById('user-btn').addEventListener('click', switchUser);

// ---- 启动 ----
(function init(){
  // 尝试恢复上次登录的学生
  let saved = null;
  try{ saved = localStorage.getItem(ACTIVE_USER_KEY); }catch(e){}
  if(saved){
    currentUser = saved;
    state.save = { stars:{}, bestCombo:0, badges:[], revengeCards:[] };
    loadSave();
    persist();
    renderMap();
    document.getElementById('login-page').classList.remove('active');
    document.getElementById('map-page').classList.add('active');
    showToast(`👋 欢迎回来，${saved}！`,'rank');
  }else{
    renderLogin();
  }
})();
</script>
