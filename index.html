<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum‑scale=1.0, user‑scalable=no"/>
<title>Formula Quest — Math Trainer</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui, -apple-system, Segoe UI, Roboto, sans-serif}
:root{
  --bg:#12141c;
  --panel:#1e2230;
  --accent:#42a5f5;
  --danger:#ef5350;
  --success:#66bb6a;
  --text:#e9eaf2;
  --muted:#9498b3;
}
html,body{background:var(--bg);color:var(--text);min-height:100svh;overflow-x:hidden}
body{overscroll-behavior:none;padding:12px}
button{background:var(--accent);color:#000;border:none;border-radius:8px;padding:10px 14px;font-weight:600;font-size:1rem;touch-action:manipulation}
button:disabled{opacity:0.4}
button:active{transform:scale(0.96)}
.btnDanger{background:var(--danger);color:#fff}
.btnSuccess{background:var(--success);color:#000}

.page{display:none;margin:0 auto;max-width:640px}
.page.active{display:block}

.moduleGrid{display:grid;gap:14px;margin:20px 0}
.moduleCard{background:var(--panel);border-radius:12px;padding:20px;border:1px solid #2c3042;cursor:pointer}
.moduleTitle{font-size:1.2rem;font-weight:bold;margin-bottom:6px}
.moduleDesc{font-size:0.9rem;color:var(--muted)}

.mapGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}
.levelCard{background:var(--panel);border-radius:10px;padding:12px;border:1px solid #2c3042;cursor:pointer}
.levelTitle{font-weight:bold;margin-bottom:4px}
.stars{color:#ffd54f}

.hpBarWrap{background:#2a2e3f;border-radius:6px;height:18px;overflow:hidden;margin:8px 0}
.hpBar{height:100%;background:var(--success);width:100%;transition:width 0.25s}
.bossHpWrap{background:#2a2e3f;border-radius:6px;height:22px;overflow:hidden;margin:10px 0}
.bossHpBar{height:100%;background:var(--danger);width:100%;transition:width 0.25s}
.comboText{font-size:1.1rem;font-weight:bold;color:#ffd54f;margin:6px 0}
.cardBox{background:var(--panel);border-radius:12px;padding:18px;margin:12px 0;border:1px solid #33384e}
.questionText{font-size:1.05rem;line-height:1.5;margin-bottom:12px}
.optionList{display:grid;gap:8px;margin:12px 0}
.optBtn{text-align:left;padding:12px}

.dragArea{border:2px dashed #444a63;border-radius:10px;padding:14px;margin:12px 0;min-height:100px}
.dropSlot{background:#242838;border:1px solid #505778;border-radius:6px;padding:10px;min-height:44px;margin:4px;font-weight:bold}
.wordBankTitle{margin-top:8px;color:var(--muted);font-size:0.9rem}

.toast{position:fixed;top:18px;left:50%;transform:translateX(-50%);background:#272b3b;padding:10px 16px;border-radius:8px;z-index:100;opacity:0;transition:opacity 0.25s}
.floatVal{position:fixed;font-weight:bold;font-size:1.3rem;pointer-events:none;z-index:99}

.resultBox{text-align:center;margin-top:20px}
.starBig{font-size:2.4rem;color:#ffd54f}
.navRow{display:flex;gap:8px;justify-content:center;margin-top:16px;flex-wrap:wrap}
small{color:var(--muted)}
hr{border:none;border-top:1px solid #33384e;margin:16px 0}
.optBtn.used{opacity:.35}
.dropSlot.filled{border-color:var(--accent);color:var(--accent)}
.dropSlot.bad{border-color:var(--danger);color:var(--danger)}
.moduleCard:active{transform:scale(.98)}
.levelCard:active{transform:scale(.97)}
.revMod{font-size:.78rem;color:var(--accent);font-weight:bold}
.revWrong{color:var(--danger);margin:4px 0}
.revRight{color:var(--success)}
</style>
</head>
<body>

<div id="pageModuleSelect" class="page active">
  <h2>📚 Formula Quest</h2>
  <small>Strictly aligned to Edexcel exam specification</small>
  <div class="moduleGrid">
    <div class="moduleCard" data-mod="ig">
      <div class="moduleTitle">📘 IGCSE Math (4MA1/0980)</div>
      <div class="moduleDesc">IGCSE 题库 · 严格匹配IG考纲 ·10关卡</div>
    </div>
    <div class="moduleCard" data-mod="wma11">
      <div class="moduleTitle">📙 WMA11 (P1)</div>
      <div class="moduleDesc">Edexcel IAL P1 · 15关卡，不含P2专属知识点</div>
    </div>
    <div class="moduleCard" data-mod="wma12">
      <div class="moduleTitle">📗 WMA12 (P2)</div>
      <div class="moduleDesc">Edexcel IAL P2 ·12关卡，严格对齐P2 spec，无P1大题专题</div>
    </div>
  </div>
</div>

<div id="pageMap" class="page">
  <h3 id="mapHeading"></h3>
  <div class="mapGrid" id="mapContainer"></div>
  <hr/>
  <div style="display:flex;gap:8px;flex-wrap:wrap">
    <button id="btnBackToModule">⬅ 返回总选关页</button>
    <button id="btnDaily">🎲 每日秘境(本模块随机一关)</button>
    <button id="btnRevenge">📋 错题复仇库</button>
  </div>
</div>

<div id="pageBattle" class="page">
  <h3 id="levelHeading"></h3>
  <div>HP <div class="hpBarWrap"><div id="hpBar" class="hpBar"></div></div></div>
  <div class="comboText">连击: <span id="comboSpan">0</span></div>
  <div id="phaseLabel"></div>
  <div id="battleContent"></div>
</div>

<div id="pageResult" class="page">
  <div class="resultBox">
    <h3 id="resTitle"></h3>
    <div class="starBig" id="resStars"></div>
    <p id="resMsg"></p>
    <div class="navRow">
      <button id="btnReplay">🔁 重玩本关</button>
      <button id="btnBackMap">🗺 返回本模块地图</button>
    </div>
  </div>
</div>

<div id="pageRevenge" class="page">
  <h3>📋 错题复仇库（全部模块汇总）</h3>
  <div id="revList"></div>
  <br/><button id="btnBackFromRevenge">返回本模块地图</button>
</div>

<div id="toast" class="toast"></div>

// ---------- 工具 ----------
const $ = id => document.getElementById(id);
function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
let toastTimer=null;
function toast(msg){ const t=$('toast'); t.textContent=msg; t.style.opacity=1; clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.style.opacity=0,1800); }
function floatVal(txt,color){ const f=document.createElement('div'); f.className='floatVal'; f.textContent=txt; f.style.color=color||'#fff'; f.style.left=(35+Math.random()*30)+'%'; f.style.top='45%'; document.body.appendChild(f); f.animate([{transform:'translateY(0)',opacity:1},{transform:'translateY(-70px)',opacity:0}],{duration:900}).onfinish=()=>f.remove(); }
function showPage(id){ document.querySelectorAll('.page').forEach(p=>p.classList.remove('active')); $(id).classList.add('active'); window.scrollTo(0,0); }

// ---------- 存储 ----------
function loadStars(mod){ try{ return JSON.parse(localStorage.getItem(MOD_META[mod].starKey)||'{}'); }catch(e){ return {}; } }
function saveStar(mod,id,stars){ const all=loadStars(mod); if((all[id]||0)<stars){ all[id]=stars; localStorage.setItem(MOD_META[mod].starKey,JSON.stringify(all)); } }
function loadRevenge(){ try{ return JSON.parse(localStorage.getItem('fq_revenge')||'[]'); }catch(e){ return []; } }
function addRevenge(wrong,right){ const all=loadRevenge(); if(all.some(c=>c.wrong===wrong)) return; all.unshift({ wrong, right, mod:state.module, level:state.level?state.level.title:'', ts:Date.now() }); if(all.length>80) all.length=80; localStorage.setItem('fq_revenge',JSON.stringify(all)); }

// ---------- 模块首页 ----------
document.querySelectorAll('.moduleCard').forEach(card=>{
  card.addEventListener('click',()=>{ state.module=card.dataset.mod; renderMap(); showPage('pageMap'); });
});

// ---------- 地图 ----------
function renderMap(){
  const bank=QUEST_BANK[state.module];
  $('mapHeading').textContent=MOD_META[state.module].name+' · 关卡地图';
  const stars=loadStars(state.module);
  $('mapContainer').innerHTML=bank.map(q=>{
    const s=stars[q.id]||0;
    return `<div class="levelCard" data-id="${q.id}"><div class="levelTitle">${esc(q.title)}</div><div class="stars">${'★'.repeat(s)}${'☆'.repeat(3-s)}</div></div>`;
  }).join('');
  $('mapContainer').querySelectorAll('.levelCard').forEach(c=>{
    c.addEventListener('click',()=>startLevel(bank.find(q=>q.id===+c.dataset.id),false));
  });
}

// ---------- 战斗 ----------
function startLevel(level,isDaily){
  state.level=level; state.isDaily=!!isDaily; state.finished=false;
  state.hp=100; state.bossHP=100; state.combo=0; state.maxCombo=0; state.errors=0;
  state.fi=0; state.fii=0; state.bi=0;
  $('levelHeading').textContent=(isDaily?'🎲 秘境 · ':'')+level.title;
  showPage('pageBattle');
  renderPhase();
}
function updateHUD(){
  const hpBar=$('hpBar'); if(hpBar) hpBar.style.width=Math.max(0,state.hp)+'%';
  const bossBar=$('bossHpBar'); if(bossBar) bossBar.style.width=Math.max(0,state.bossHP)+'%';
  const combo=$('comboSpan'); if(combo) combo.textContent=state.combo;
}
function correct(){ state.combo++; state.maxCombo=Math.max(state.maxCombo,state.combo); state.bossHP=Math.max(0,state.bossHP-20); floatVal('BOSS −20','#42a5f5'); updateHUD(); }
function wrong(right){
  state.combo=0; state.errors++; state.hp=Math.max(0,state.hp-20);
  addRevenge(state.level.title+' · '+(state.phase===0?'闪卡':state.phase===1?'填空':'BOSS'), right);
  floatVal('HP −20','#ef5350'); updateHUD();
}
function renderPhase(){
  updateHUD();
  if(state.bossHP<=0 || state.hp<=0 || state.phase>2){ finish(); return; }
  if(state.phase===0) renderFlash();
  else if(state.phase===1) renderFill();
  else renderBoss();
}
function phaseBar(){ return `<small>${state.phase===0?'① 闪卡突袭':state.phase===1?'② 选词填空':'③ BOSS 决战'}</small>`; }

function renderFlash(){
  const q=state.level.flash[state.fi];
  $('phaseLabel').innerHTML=phaseBar()+` <small>(${state.fi+1}/${state.level.flash.length})</small>`;
  const opts=shuffle(q.opts.slice());
  $('battleContent').innerHTML=`<div class="cardBox">
    <div class="questionText">${esc(q.q)}</div>
    <div class="optionList">${opts.map(o=>`<button class="optBtn" data-v="${esc(o)}">${esc(o)}</button>`).join('')}</div></div>`;
  $('battleContent').querySelectorAll('.optBtn').forEach(b=>b.addEventListener('click',()=>{
    if(b.dataset.v===q.ans){ toast('✓ 正确!'); correct(); }
    else { toast('✗ 答案: '+q.ans); wrong(q.ans); }
    state.fi++;
    if(state.fi>=state.level.flash.length) state.phase=1;
    setTimeout(renderPhase,700);
  }));
}

function renderFill(){
  const q=state.level.fill[state.fii];
  $('phaseLabel').innerHTML=phaseBar()+` <small>(${state.fii+1}/${state.level.fill.length})</small>`;
  state.fillAnswer=new Array(q.blanks.length).fill(null);
  const parts=q.prompt.split('□');
  let promptHTML='';
  parts.forEach((p,i)=>{ promptHTML+=esc(p); if(i<q.blanks.length) promptHTML+=`<div class="dropSlot" data-slot="${i}">?</div>`; });
  const pool=shuffle(q.pool.slice());
  $('battleContent').innerHTML=`<div class="cardBox">
    <div class="questionText">${promptHTML}</div>
    <div class="wordBankTitle">词库（点击选词填入空格）</div>
    <div class="optionList">${pool.map(w=>`<button class="optBtn" data-w="${esc(w)}">${esc(w)}</button>`).join('')}</div>
    <button id="fillSubmit" style="margin-top:10px">提交答案</button></div>`;
  $('battleContent').querySelectorAll('.optBtn').forEach(b=>b.addEventListener('click',()=>{
    if(b.classList.contains('used')) return;
    const empty=state.fillAnswer.indexOf(null);
    if(empty<0){ toast('空格已填满，点提交'); return; }
    state.fillAnswer[empty]=b.dataset.w; b.classList.add('used');
    const slot=$('battleContent').querySelector(`.dropSlot[data-slot="${empty}"]`);
    if(slot){ slot.textContent=b.dataset.w; slot.classList.add('filled'); }
  }));
  $('fillSubmit').addEventListener('click',()=>{
    if(state.fillAnswer.some(x=>x===null)){ toast('请先填满所有空格'); return; }
    const ok=state.fillAnswer.every((v,i)=>v===q.blanks[i]);
    const right='答案: '+q.blanks.join(' / ');
    if(ok){ toast('✓ 正确!'); correct(); }
    else { toast('✗ '+right); wrong(right); }
    state.fii++;
    if(state.fii>=state.level.fill.length) state.phase=2;
    setTimeout(renderPhase,700);
  });
}

function renderBoss(){
  const q=state.level.boss[state.bi];
  $('phaseLabel').innerHTML=phaseBar()+` <small>(${state.bi+1}/${state.level.boss.length})</small>`;
  const opts=shuffle(q.opts.slice());
  $('battleContent').innerHTML=`<div class="cardBox">
    <div class="questionText">⚔️ ${esc(q.prompt)}</div>
    <div class="optionList">${opts.map(o=>`<button class="optBtn" data-v="${esc(o)}">${esc(o)}</button>`).join('')}</div></div>`;
  $('battleContent').querySelectorAll('.optBtn').forEach(b=>b.addEventListener('click',()=>{
    if(b.dataset.v===q.ans){ toast('✓ 暴击!'); correct(); }
    else { toast('✗ 答案: '+q.ans); wrong(q.ans); }
    state.bi++;
    if(state.bi>=state.level.boss.length) state.phase=3;
    setTimeout(renderPhase,700);
  }));
}

// ---------- 结算 ----------
function finish(){
  if(state.finished) return; state.finished=true;
  const win=state.bossHP<=0 && state.hp>0;
  let stars=0;
  if(win) stars = state.errors===0?3 : state.errors<=2?2 : 1;
  if(win) saveStar(state.module,state.level.id,stars);
  $('resTitle').textContent=win?'🎉 通关成功！':'💔 挑战失败';
  $('resStars').textContent=win?('★'.repeat(stars)+'☆'.repeat(3-stars)):'☆☆☆';
  $('resMsg').textContent=win?`${state.level.title} · 最高连击 ${state.maxCombo} · 答错 ${state.errors} 次`:'HP 归零，再来一次吧！';
  showPage('pageResult');
}

// ---------- 错题库 ----------
function renderRevenge(){
  const all=loadRevenge();
  if(!all.length){ $('revList').innerHTML='<p><small>还没有错题，继续加油！</small></p>'; return; }
  $('revList').innerHTML=all.map((c,i)=>`<div class="cardBox" style="padding:12px">
    <div class="revMod">${esc(MOD_META[c.mod]?MOD_META[c.mod].name:'')} · ${esc(c.level||'')}</div>
    <div class="revWrong">✗ ${esc(c.wrong)}</div>
    <div class="revRight">${esc(c.right)}</div>
    <button class="btnDanger revDel" data-i="${i}" style="margin-top:8px;padding:6px 10px;font-size:.85rem">移除</button></div>`).join('');
  $('revList').querySelectorAll('.revDel').forEach(b=>b.addEventListener('click',()=>{
    const arr=loadRevenge(); arr.splice(+b.dataset.i,1); localStorage.setItem('fq_revenge',JSON.stringify(arr)); renderRevenge();
  }));
}

// ---------- 按钮 ----------
$('btnBackToModule').addEventListener('click',()=>showPage('pageModuleSelect'));
$('btnDaily').addEventListener('click',()=>{
  const bank=QUEST_BANK[state.module];
  const lv=bank[Math.floor(Math.random()*bank.length)];
  toast('🎲 抽中: '+lv.title);
  setTimeout(()=>startLevel(lv,true),600);
});
$('btnRevenge').addEventListener('click',()=>{ renderRevenge(); showPage('pageRevenge'); });
$('btnBackFromRevenge').addEventListener('click',()=>showPage('pageMap'));
$('btnReplay').addEventListener('click',()=>startLevel(state.level,state.isDaily));
$('btnBackMap').addEventListener('click',()=>{ renderMap(); showPage('pageMap'); });

</script>
</body>
</html>
